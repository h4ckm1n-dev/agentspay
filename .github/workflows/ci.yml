name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (Rust + Frontend)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.lock') }}

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets

      - name: cargo test (compile only)
        run: cargo test --workspace --no-run

      - name: cargo test (run)
        run: cargo test --workspace -- --nocapture

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt check
        run: cargo fmt --check

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # No explicit version — the action reads `packageManager` from
        # package.json (currently pnpm@9.15.0). Specifying both causes
        # ERR_PNPM_BAD_PM_VERSION.


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm --filter frontend lint

      - name: Frontend typecheck
        run: pnpm --filter frontend typecheck

      - name: Frontend build
        run: pnpm --filter frontend build

      - name: SDK typecheck + tests
        run: pnpm --filter @agentspay/sdk-js test

      - name: CLI typecheck + build
        run: pnpm --filter @agentspay/cli build

  docker:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check

    # Only run on version tags
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agentspay-shim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.shim
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentspay-shim:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/agentspay-shim:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agentspay-paid-endpoint
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.paid-endpoint
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentspay-paid-endpoint:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/agentspay-paid-endpoint:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agentspay-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://agentspay.sabaidev.la
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentspay-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/agentspay-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-web:
    name: Build security review web image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/security-web.test.cjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          platforms: linux/amd64
          build-args: NEXT_PUBLIC_SITE_URL=https://agentspay.sabaidev.la
          tags: ghcr.io/${{ github.repository_owner }}/agentspay-web:${{ github.sha }}
          cache-from: type=gha,scope=security-web
          cache-to: type=gha,mode=max,scope=security-web
      - name: Check standalone public routes
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/agentspay-web@${{ steps.image.outputs.digest }}
        run: |
          docker run --rm --entrypoint node "$IMAGE" -e "const a=require('node:assert/strict');a.equal(require('node:module').createRequire('/app/apps/frontend/server.js')('next/package.json').version,'15.5.28');a.equal(process.getuid(),1000)"
          docker run -d --name security-web -p 127.0.0.1:3000:3000 "$IMAGE"
          trap 'docker logs security-web; docker rm -f security-web' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ -o /dev/null
          for route in docs demo proof robots.txt sitemap.xml; do
            curl --fail --silent --show-error "http://127.0.0.1:3000/$route" -o /dev/null
          done
      - name: Record immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/agentspay-web
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('web.json').write_text(json.dumps({key: os.environ[key.upper()] for key in ('image', 'digest', 'source_sha')}))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: image-web
          path: web.json
          if-no-files-found: error
